name: Update Leaderboard

on:
  workflow_dispatch:
  # Optional: Uncomment during event to auto-refresh every 5 minutes
  # schedule:
  #   - cron: '*/5 * * * *'

permissions:
  contents: write
  pull-requests: read
  issues: read

jobs:
  update-leaderboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Build Leaderboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/build_leaderboard.py

      - name: Commit and Push Updated Leaderboard
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add LEADERBOARD.md
          git diff --staged --quiet || (git commit -m "Auto-update challenge leaderboard [skip ci]" && git push)
