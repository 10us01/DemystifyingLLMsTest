name: "🧪 Autograde Challenge"

on:
  pull_request:
    branches: ['main']

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout student code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify test integrity
        run: |
          if git diff origin/main --name-only | grep -q "^tests/"; then
            echo "::error::DISQUALIFIED - tests/ directory was modified!"
            echo '## ❌ DISQUALIFIED' > score_report.md
            echo '' >> score_report.md
            echo 'You modified files in the `tests/` directory. This is not allowed.' >> score_report.md
            echo '{"total": 0, "disqualified": true}' > score.json
            exit 1
          else
            echo "Tests directory integrity verified ✅"
          fi

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite
        run: |
          python -m pytest tests/             --tb=no             --no-header             -q             --timeout=30             --junitxml=results.xml             || true

      - name: Compute score
        if: hashFiles('results.xml') != ''
        run: python scripts/grade.py results.xml

      - name: Post score to PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('score_report.md')) return;
            const report = fs.readFileSync('score_report.md', 'utf8');
            
            const comments = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            for (const c of comments.data) {
              if (c.body && c.body.includes('Autograder')) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: c.id
                });
              }
            }
            
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });
